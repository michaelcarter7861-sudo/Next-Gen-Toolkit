name: Generate social preview PNG
on:
  push:
    branches: [main]
    paths:
      - "public/og-cover.svg"
      - ".github/workflows/generate-og-image.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render 1200x630 PNG from source SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 public/og-cover.svg > public/og-cover.png
          file public/og-cover.png
      - name: Commit generated PNG
        run: |
          if git diff --quiet -- public/og-cover.png; then
            echo "Social preview PNG is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-cover.png
          git commit -m "build: generate PNG social preview image"
          git push
