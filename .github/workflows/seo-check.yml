name: Production SEO build check

# Validates the exact production configuration (origin, canonical host, sitemap)
# before a Cloudflare Pages deploy. Kept separate from the pull-request quality
# gate because it asserts production-only invariants (absolute URLs, robots host).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://nextgentoolkit.pages.dev
      VITE_SITE_URL: https://nextgentoolkit.pages.dev
      VITE_STATIC_DEPLOYMENT: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (runs generate-seo-pages and verify-seo-build)
        run: npm run build

      - name: Assert production invariants
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -s dist/og-cover.png
          test -f dist/_headers

          # Trust pages must ship with every build.
          for page in about contact privacy terms editorial-policy changelog; do
            test -f "dist/$page/index.html" || { echo "Missing trust page: $page"; exit 1; }
          done

          # The rasteriser is live now, so its page must be indexable...
          test -f dist/pdf-tools/pdf-to-image/index.html
          grep -q 'rel="canonical"' dist/pdf-tools/pdf-to-image/index.html
          # ...while the OCR page remains honestly quarantined.
          test -f dist/image-tools/image-to-text-ocr/index.html
          grep -q 'name="robots" content="noindex' dist/image-tools/image-to-text-ocr/index.html
          if grep -q 'image-to-text-ocr' dist/sitemap.xml; then
            echo "Preview tool leaked into the sitemap"; exit 1
          fi

          # Core SEO invariants for a money page.
          grep -q 'rel="canonical"' dist/image-tools/compress-image-to-kb/index.html
          grep -q 'application/ld+json' dist/image-tools/compress-image-to-kb/index.html

          node -e "
            const fs = require('node:fs');
            const xml = fs.readFileSync('dist/sitemap.xml', 'utf8');
            const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map((m) => m[1]);
            if (urls.length < 30) { console.error('Sitemap too small:', urls.length); process.exit(1); }
            const robots = fs.readFileSync('dist/robots.txt', 'utf8');
            if (!robots.includes('sitemap.xml')) { console.error('robots.txt missing sitemap'); process.exit(1); }
            console.log('Production sitemap URLs:', urls.length);
          "
