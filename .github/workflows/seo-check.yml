name: NextGenToolkit SEO Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://nextgentoolkit.pages.dev
      VITE_SITE_URL: https://nextgentoolkit.pages.dev
      VITE_STATIC_DEPLOYMENT: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render the social preview PNG from its SVG source\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y librsvg2-bin\n          rsvg-convert --width 1200 --height 630 public/og-cover.svg --output public/og-cover.png\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n          if ! git diff --quiet -- public/og-cover.png; then\n            git add public/og-cover.png\n            git commit -m \"chore: regenerate NextGenToolkit social preview PNG\"\n            git push\n          fi\n\n      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run utility engine tests
        run: npm test

      - name: Type-check project
        run: npm run lint

      - name: Build and generate static SEO pages
        run: npm run build

      - name: Verify generated SEO routes
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml\n          test -s dist/og-cover.png
          test -f dist/pdf-tools/compress-pdf/index.html
          test -f dist/image-tools/compress-image-to-kb/index.html
          test -f dist/dev-tools/json-formatter-validator/index.html
          test -f dist/generators/cron-expression-generator/index.html
          grep -q 'rel="canonical"' dist/pdf-tools/compress-pdf/index.html
          grep -q 'application/ld+json' dist/pdf-tools/compress-pdf/index.html
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, existsSync } from 'node:fs';
          const base = new URL(process.env.SITE_URL).pathname.replace(/\/+$/, '');
          const png = readFileSync('dist/og-cover.png');\n          assert.equal(png.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', 'Social preview must be a PNG');\n          assert.equal(png.readUInt32BE(16), 1200, 'Social preview width must be 1200px');\n          assert.equal(png.readUInt32BE(20), 630, 'Social preview height must be 630px');\n          const xml = readFileSync('dist/sitemap.xml', 'utf8');
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1]);
          assert.equal(urls.length, 31, 'Expected homepage + 5 hubs + 25 tool URLs');
          for (const url of urls) {
            const pathname = new URL(url).pathname.slice(base.length).replace(/^\/+|\/+$/g, '');
            const html = pathname ? `dist/${pathname}/index.html` : 'dist/index.html';
            assert.ok(existsSync(html), `Missing prerendered route: ${html}`);
            const page = readFileSync(html, 'utf8');
            assert.ok(page.includes(`<link rel=\"canonical\" href=\"${url}\"`), `Missing canonical: ${url}`);
            assert.ok(page.includes('<h1>'), `Missing server-rendered heading: ${url}`);
          }
          assert.ok(readFileSync('dist/robots.txt', 'utf8').includes('sitemap.xml'));
          console.log(`Validated ${urls.length} prerendered routes.`);
          NODE

      - name: Upload static site artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: nextgentoolkit-static-site
          path: dist
          if-no-files-found: error
